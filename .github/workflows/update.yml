name: Update check

on:
  schedule:
    - cron: "30 4 * * 0,3"
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    # Allow manual triggering of the workflow
    inputs:
      force_package:
        description: "Package to force a resubmit of (AU fix version, e.g. 1.2.3.20261025). Leave at 'none' for a normal run."
        type: choice
        default: none
        options:
          - none
          - f2
          - heynote
          - RegionToShare

permissions:
  contents: write  # AU commits and pushes package updates

concurrency:
  # Don't let a push and the scheduled run update and push at the same time
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Choco install updater
        run: choco install chocolatey-au wormies-au-helpers --confirm --no-progress
        shell: powershell

      - name: Update
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          refreshenv
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global core.safecrlf false
          if ($Env:force_package -and $Env:force_package -ne 'none') {
            # Only touch the chosen package and bump it to a fix version
            .\update_all.ps1 -Name $Env:force_package -ForcedPackages $Env:force_package
          } else {
            .\update_all.ps1
          }
        shell: powershell
        env:
          force_package: ${{ inputs.force_package }}
          api_key: ${{ secrets.choco_api_key }}
          github_user_repo: ${{ github.repository }}
          github_api_key: ${{ secrets.GITHUB_TOKEN }}
          au_Push: "true"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: au-reports
          path: |
            Update-AUPackages.md
            Update-History.md
          if-no-files-found: ignore
