name: Update check

on:
  schedule:
    - cron: "30 4 * * 0,3"
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    # Allow manual triggering of the workflow

permissions:
  contents: write  # AU commits and pushes package updates

concurrency:
  # Don't let a push and the scheduled run update and push at the same time
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Choco install updater
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install chocolatey-au wormies-au-helpers --confirm

      - name: Update
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          refreshenv
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global core.safecrlf false
          .\update_all.ps1
        shell: powershell
        env:
          api_key: ${{ secrets.choco_api_key }}
          github_user_repo: ${{ github.repository }}
          github_api_key: ${{ secrets.GITHUB_TOKEN }}
          au_Push: "true"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: au-reports
          path: |
            Update-AUPackages.md
            Update-History.md
          if-no-files-found: ignore
